name: eturlia-ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository and uploads artifacts.
permissions:
  contents: read

# A new push to the same branch supersedes the previous (long) build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # paperweight ApplyGitPatches commits into Folia-Server/API worktrees
      - name: Configure git identity for paperweight
        run: |
          git config --global user.email "eturlia-ci@users.noreply.github.com"
          git config --global user.name "Eturlia CI"

      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace

      - name: Build Folia-Server + Eturlia standalone jar
        run: ./gradlew :folia-server:eturliaStandaloneJar --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eturlia-jar
          path: build/libs/eturlia-*.jar
          if-no-files-found: error

  headless-smoke-empty:
    needs: apply-and-jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: eturlia-jar
          path: dist
      - name: Headless empty smoke
        run: |
          set -euo pipefail
          JAR=$(ls dist/eturlia-*.jar | head -1)
          mkdir -p smoke && cd smoke
          echo "eula=true" > eula.txt
          # The launcher spawns the real server as a child JVM. `timeout` signals only the
          # launcher, so ask for a group kill (-k) and let the launcher's shutdown hook
          # bring the child down; anything still alive afterwards is killed explicitly.
          timeout --signal=TERM --kill-after=30s 180 java -Xmx2G -jar "../$JAR" --nogui || true
          pkill -9 -f 'eturlia-libraries' 2>/dev/null || true
          # Accept either clean Done or timeout after boot progressed
          if grep -E "Done \\(|ServerModLoader completed" logs/latest.log; then
            echo "SMOKE_OK"
          else
            echo "=== latest.log (tail) ==="
            tail -n 80 logs/latest.log || true
            exit 1
          fi
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            smoke/logs/
            smoke/crash-reports/
            smoke/eturlia-crash-reports/
          if-no-files-found: ignore
