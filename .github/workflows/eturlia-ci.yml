name: eturlia-ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  apply-and-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace

      - name: Build Folia-Server + Eturlia standalone jar
        run: ./gradlew :folia-server:eturliaStandaloneJar --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eturlia-jar
          path: build/libs/eturlia-*.jar
          if-no-files-found: error

  headless-smoke-empty:
    needs: apply-and-jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: eturlia-jar
          path: dist
      - name: Headless empty smoke
        run: |
          set -euo pipefail
          JAR=$(ls dist/eturlia-*.jar | head -1)
          mkdir -p smoke && cd smoke
          echo "eula=true" > eula.txt
          timeout 180 java -Xmx2G -jar "../$JAR" --nogui || true
          # Accept either clean Done or timeout after boot progressed
          if grep -E "Done \\(|ServerModLoader completed" logs/latest.log; then
            echo "SMOKE_OK"
          else
            echo "=== latest.log (tail) ==="
            tail -n 80 logs/latest.log || true
            exit 1
          fi
