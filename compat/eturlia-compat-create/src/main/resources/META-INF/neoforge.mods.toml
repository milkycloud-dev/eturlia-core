modLoader="javafml"
loaderVersion="[3,)"
license="LGPL-2.1-or-later"
issueTrackerURL="https://github.com/eturlia/eturlia-neoforge/issues"

[[mods]]
    modId="eturlia_compat_create"
    version="${version}"
    displayName="Eturlia Compat: Create"
    authors="Eturlia Team"
    description='''
    WORK IN PROGRESS — this module does not do anything yet.

    Intended as a compatibility layer for Create and Create Big Cannons on Eturlia
    (Folia-based) regionized servers: kinetic networks, contraptions, projectiles and
    explosions crossing region boundaries. All handlers are currently stubs and no mixins
    are applied. Installing this mod has no effect beyond appearing in the mod list.
    '''

[[dependencies.eturlia_compat_create]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.eturlia_compat_create]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.eturlia_compat_create]]
    modId="create"
    type="required"
    versionRange="[0.5.1,)"
    ordering="AFTER"
    side="BOTH"

# No [[mixins]] entry: the mixin config listed four classes (kinetic/contraption/projectile/
# explosion) and a mixin plugin that do not exist in this source tree. With
# "required": true that made the module fail hard at load time instead of no-opping.
# Re-add the config together with the actual mixin classes.
