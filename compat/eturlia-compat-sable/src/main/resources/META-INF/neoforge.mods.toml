modLoader="javafml"
loaderVersion="[3,)"
license="LGPL-2.1-or-later"
issueTrackerURL="https://github.com/eturlia/eturlia-neoforge/issues"

[[mods]]
    modId="eturlia_compat_sable"
    version="${version}"
    displayName="Eturlia Compat: Sable"
    authors="Eturlia Team"
    description='''
    WORK IN PROGRESS — this module does not do anything yet.

    Intended as a compatibility layer for Sable and Create Aeronautics on Eturlia
    (Folia-based) regionized servers: Rapier physics (JNI) against Folia's per-region
    threading, cross-region sub-level management and JNI callback auditing. All handlers
    are currently stubs and no mixins are applied.
    '''

[[dependencies.eturlia_compat_sable]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.eturlia_compat_sable]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.eturlia_compat_sable]]
    modId="sable"
    type="required"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.eturlia_compat_sable]]
    modId="create_aeronautics"
    type="required"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

